      tags:
      - 首页
  /home/top:
    post:
      consumes:
      - application/json
      description: '公开接口，无需登录。返回当前有效置顶时间窗口内的岗位，按到期时间倒序。type: 0或不传=全部 1=招聘 2=求职，不传默认0。limit:
        最大返回条数，不传默认5。'
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.HomeTopRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.HomeTopResponseData'
      summary: 首页置顶区
      tags:
      - 首页
  /img/upload:
    post:
      consumes:
      - multipart/form-data
      parameters:
