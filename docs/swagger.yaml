host: localhost:8000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a sample server celler server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Nunu Example API
  version: 1.0.0
paths:
  /close_reasons:
    get:
      consumes:
      - application/json
      description: '根据岗位类型返回对应的关闭原因枚举。type: 1=招聘 2=求职 3=招租，不传默认1。'
      parameters:
      - description: 岗位类型：1=招聘 2=求职 3=招租
        in: query
        name: type
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.JobCloseReasonResponse'
      summary: 获取关闭原因列表
      tags:
      - 通用接口
  /collect/my:
    post:
      consumes:
      - application/json
      description: '返回当前用户的收藏列表。biz_type: 0=全部 1=招聘（当前仅支持招聘），不传默认全部。'
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.CollectMyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.CollectMyResponseData'
      security:
      - Bearer: []
      summary: 我收藏的岗位
      tags:
      - 收藏模块
  /contact_history/in:
    delete:
      consumes:
      - application/json
      description: 软删除收到的联系记录（对对方不可见）。purpose_id 为联系记录 ID（非岗位 ID）。
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.ContactHistoryDeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      security:
      - Bearer: []
      summary: 删除联系我的记录
      tags:
      - 联系模块
    post:
      consumes:
      - application/json
      description: '返回其他用户联系过当前用户岗位的记录。biz_type: 0=全部 1=招聘 2=求职，不传默认全部。'
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.ContactHistoryListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.ContactHistoryListResponseData'
      security:
      - Bearer: []
      summary: 联系我的（收到的联系记录）
      tags:
      - 联系模块
  /contact_history/out:
    delete:
      consumes:
      - application/json
      description: 软删除发出的联系记录（对对方不可见）。purpose_id 为联系记录 ID（非岗位 ID）。
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.ContactHistoryDeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      security:
      - Bearer: []
      summary: 删除我联系的记录
      tags:
      - 联系模块
    post:
      consumes:
      - application/json
