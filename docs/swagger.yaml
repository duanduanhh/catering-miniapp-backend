      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      security:
      - Bearer: []
      summary: 重新开启岗位
      tags:
      - 岗位模块
  /jobs/top:
    post:
      consumes:
      - application/json
      description: 创建置顶订单并返回微信支付参数，支付成功后后台回调自动写入置顶时间窗口。top_hour 单位：小时，必须>0；price 单位：元，必须>0。仅限岗位所有者操作。
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.JobTopRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.PayOrderResponseData'
      security:
      - Bearer: []
      summary: 岗位置顶（付费）
      tags:
      - 岗位模块
  /jobs/update:
    post:
      consumes:
      - application/json
      description: 更新岗位字段，所有字段均为可选，传哪个改哪个。photo_urls 最多4张；basic_protection/salary_benefits/attendance_leave
        传空数组表示清空。
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.JobUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      security:
      - Bearer: []
      summary: 修改岗位信息
      tags:
      - 岗位模块
  /order/status:
    post:
      consumes:
      - application/json
      description: '前端唤起微信支付后，通过此接口确认订单在后端的真实支付状态。status: 1=待支付 2=已支付 3=已取消 4=已退款。建议支付完成后轮询直到
        status=2 再刷新业务页面。'
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.OrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.OrderStatusResponseData'
      security:
      - Bearer: []
      summary: 查询订单支付状态
      tags:
      - 订单
  /positions/all:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.GetPositionCategoryResponseData'
      summary: 获取岗位分类列表
      tags:
      - 通用接口
  /report/reasons:
    get:
      description: 返回举报表单的原因选项列表，前端用于渲染单选项
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.ReportReasonsResponseData'
      summary: 获取举报原因选项列表
      tags:
      - 举报
  /report/submit:
    post:
      consumes:
      - application/json
      description: 对岗位进行违规举报。reason 值域：1=诈骗/收费 2=薪资虚假 3=代招冒充直招 4=无法联系到招聘方 5=其他
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.ReportSubmitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      security:
      - Bearer: []
      summary: 提交举报
      tags:
      - 举报
  /user/info:
    get:
      consumes:
      - application/json
      description: '返回当前登录用户的基本信息。sex: 0=未设置 1=男 2=女。first_top_status: 0=未享受首次置顶优惠
        1=已享受。new_customer_status: 0=未享受新用户优惠 1=已享受。profile_complete_status: 0=未完善
        1=已完善（填写手机号）。'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.UserInfoResponse'
      security:
      - Bearer: []
      summary: 查询个人信息
      tags:
      - 用户模块
  /user/invites:
    post:
      consumes:
      - application/json
      description: 返回当前用户邀请注册的用户列表，按注册时间倒序。invite_total 为累计邀请总人数；total 为当前分页总数。
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.UserInviteListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.UserInviteListResponseData'
      security:
      - Bearer: []
      summary: 邀请记录
      tags:
      - 个人中心
  /user/orders:
    post:
      consumes:
      - application/json
      description: '返回当前用户已支付的订单列表，按创建时间倒序。product_type: 1=岗位置顶 2=联系券 3=付费刷新。amount
        单位：元。'
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.UserOrderListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.UserOrderListResponseData'
      security:
      - Bearer: []
      summary: 消费记录
      tags:
      - 个人中心
  /user/update/geo:
    post:
      consumes:
      - application/json
      description: 更新用户的地理位置。所有字段均为可选指针，传哪个改哪个。通常在小程序授权地理位置后调用。
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateUserGeoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      security:
      - Bearer: []
      summary: 更新位置信息
      tags:
      - 用户模块
  /user/update/info:
    post:
      consumes:
      - application/json
      description: '更新用户基本信息。所有字段均为可选指针，传哪个改哪个。sex: 1=男 2=女。phone 更新后 profile_complete_status
        自动置1。'
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateUserInfoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      security:
      - Bearer: []
      summary: 更新个人信息
      tags:
      - 用户模块
  /wechat/pay/notify:
    post:
      consumes:
      - application/json
      description: 微信支付结果异步通知接口，由微信服务器主动调用，前端无需关注。收到回调后解密验签，金额一致则更新订单状态并执行对应业务逻辑（置顶/券充值/刷新）。
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.WechatPayNotifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      summary: 微信支付回调（仅供微信服务器调用）
      tags:
      - 支付模块
  /wechat/user/login:
    post:
      consumes:
      - application/json
      description: 通过微信小程序 login code 换取 JWT token。用户不存在时返回 404，需先调用 /register。token
        放在后续请求的 `token` header 中（小写，非 Authorization）。
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.WechatLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.WechatLoginResponseData'
      summary: 微信登录
      tags:
      - 用户模块
  /wechat/user/register:
    post:
      consumes:
      - application/json
      description: 通过微信小程序注册新用户，需同时传手机号授权 code 和登录 code。inviter_id 为可选邀请人用户ID。注册成功后直接返回
        token，无需再调 /login。若 openid 已注册返回 400。
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.WechatRegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.WechatLoginResponseData'
      summary: 微信注册
      tags:
      - 用户模块
securityDefinitions:
  Bearer:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
