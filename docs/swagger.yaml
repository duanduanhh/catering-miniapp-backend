      tags:
      - 联系券模块
  /feedback/my:
    post:
      consumes:
      - application/json
      description: 返回当前用户提交的反馈列表，按创建时间倒序。响应中 type_name 为 type 对应的中文名称。
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.FeedbackListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.FeedbackListResponseData'
      security:
      - Bearer: []
      summary: 我的意见反馈列表
      tags:
      - 意见反馈
  /feedback/submit:
    post:
      consumes:
      - application/json
      description: 提交用户反馈。type 值域：1=产品建议 2=功能问题 3=内容修正 4=其他。photo_urls 最多4张，可选。
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.FeedbackSubmitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      security:
      - Bearer: []
      summary: 提交意见反馈
      tags:
      - 意见反馈
  /home/feed:
    post:
      consumes:
      - application/json
      description: '公开接口，无需登录。返回非置顶的活跃岗位，按 COALESCE(refresh_time, create_at) 倒序排列，刷新过的优先。type:
        0或不传=全部 1=招聘 2=求职，不传默认0。'
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.HomeFeedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.HomeFeedResponseData'
