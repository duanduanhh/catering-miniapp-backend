      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.PayOrderResponseData'
      security:
      - Bearer: []
      summary: 联系券充值
      tags:
      - 联系券模块
  /contact_voucher/cost:
    post:
